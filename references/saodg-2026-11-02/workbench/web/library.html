<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><link rel="icon" href="data:,"/><link rel="stylesheet" href="/src/library.css"/><title>结构工作台 · 作者结构库</title><script type="module" src="/src/library.js"></script></head>
<body>
  <header class="library-header"><div class="brand-mark" aria-hidden="true">▦</div><div><span class="eyebrow">SAODG / STRUCTURE WORKBENCH</span><h1>结构工作台</h1></div><nav class="workbench-tabs" aria-label="工作台功能"><a href="/mod-structures.html">模组结构管理</a><a href="/library.html" aria-current="page">作者结构库</a></nav><div class="header-actions"><span id="save-status" role="status">本地结构库</span><button id="refresh-library">↻ 刷新目录</button><button id="close-picker" hidden>返回调整台</button></div></header>
  <div class="library-layout">
    <aside class="library-nav"><span class="nav-heading">我的结构</span><nav id="collections" aria-label="结构清单"><button data-collection="all" class="active">全部建筑 <span></span></button><button data-collection="favorites">☆ 我的收藏 <span></span></button><button data-collection="selected">☑ 已选清单 <span></span></button></nav><div class="nav-divider"></div><span class="nav-heading">按形状浏览</span><nav id="shapes" aria-label="形状筛选"></nav><div class="nav-bottom"><span class="local-dot"></span> 本机工作区<details><summary>查看索引位置</summary><p id="library-root"></p><p id="state-file"></p></details></div></aside>
    <main class="library-main"><div class="catalog-heading"><div><h2 id="collection-title">全部建筑</h2><p id="library-summary">正在读取结构索引…</p></div><span class="index-badge">完整主模型</span></div><div class="catalog-controls"><label class="search-box"><span aria-hidden="true">⌕</span><input id="library-search" type="search" aria-label="搜索结构" placeholder="搜索中文名、版本、日期或路径…"/></label><label class="history-toggle"><input id="library-history" type="checkbox"/>历史版本</label><label class="sort-label"><span class="sr-only">排序方式</span><select id="library-sort" aria-label="排序方式"><option value="recent">最近修改</option><option value="name">名称 A–Z</option><option value="shape">形状分组</option></select></label></div><p id="library-notice" role="status"></p><div id="structure-grid" class="structure-grid" aria-label="现有结构"></div><div class="pagination"><button id="previous-page">← 上一页</button><span id="page-count"></span><button id="next-page">下一页 →</button></div></main>
    <aside id="structure-detail" class="structure-detail" aria-label="结构详情"><div class="detail-placeholder"><span>▧</span><h2>选择一座建筑</h2><p>点击卡片查看版本、预览图和文件位置。勾选可加入批量清单。</p></div></aside>
  </div>
  <footer class="selection-bar"><div><strong id="selected-count">已选 0 项</strong><span>收藏与清单自动保存在本机</span></div><div><button id="clear-selection">清空清单</button><button id="export-selection">导出选择清单</button><button id="choose-structure" class="primary" disabled>在细节控制台中打开</button></div></footer>
</body></html>
