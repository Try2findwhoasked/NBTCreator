[tasks."gpu:setup"]
description = "Install optional NVIDIA compute libraries in build/gpu-env using pip cache"
run = "python scripts/gpu-runtime.py setup"

[tasks."gpu:info"]
description = "Probe the optional compute backend"
run = "python scripts/gpu-runtime.py info"

[tasks."gpu:cli"]
description = "Run the shared CLI with the optional GPU Python runtime"
run = "python scripts/gpu-runtime.py node scripts/cli.mjs"

[tasks."gpu:test"]
description = "Run CPU and real GPU compute/transform regressions"
run = "python scripts/gpu-runtime.py python -B tests/compute-transforms.py --require-gpu"

[tasks."gpu:benchmark"]
description = "Measure transfers, cold/warm compute and full tool calls"
run = "python scripts/gpu-runtime.py python -B scripts/benchmark-compute.py"

[tasks."cpu:test"]
description = "Verify bulk writes, catalogue invalidation and strict validation"
run = "python -B tests/materialization.py"

[tasks."model:test"]
description = "Verify whole-model composition, managed updates and assembly interfaces"
run = "npm run test:model-workflow"

[tasks."fit:test"]
description = "Verify fine block silhouettes, state transforms and recipe roundtrips"
run = "npm run test:fitting-shapes"

[tasks."gpu:materialization"]
description = "Benchmark CPU materialization with CPU and GPU field inputs"
run = "python scripts/gpu-runtime.py python -B scripts/benchmark-materialization.py"

[tasks."architecture:test"]
description = "Verify executable building plans, source protection and review bindings"
run = "npm run test:architecture-workflow"

[tasks."architecture:preview"]
description = "Build three full buildings through CLI/frozen entry and render three-scale reviews"
run = "npm run test:architecture-preview"

[tasks."roof:test"]
description = "Verify curved roof contact, protection and shared structure entry points"
run = "python -B tests/roof-curves.py"

[tasks."modular:test"]
description = "Verify object recipes, stair handrails, column sections and shared placement"
run = ["python -B tests/modular-objects.py", "python -B tests/window-frames.py"]

[tasks."ui:test"]
description = "Verify studio journeys, focus, delivery and six-page window/zoom layouts"
run = ["npm run build:web", "node tests/studio-redesign-desktop.mjs"]

[tools]
python = "3.14.7"
