[tasks.nbt]
description = "Run the shared NBTCreator CLI; pass --workspace for a creative project"
run = "node scripts/cli.mjs"

[tasks.dev]
description = "Build the production frontend and launch the source desktop app"
depends = ["ci:build"]
run = "npm start"

[tasks."dev:vite"]
description = "Launch the source desktop app with the Vite development server"
run = "npm run start:dev"

[tasks.doctor]
description = "Check the source app's Python, Git, Node and viewer dependencies"
run = "npm run doctor"

[tasks.check]
description = "Check tool catalogue, portable engine and migration archive integrity"
run = ["npm run check:tools", "python -B .agents/skills/minecraft-nbt-modeler/scripts/check_skill.py", "npm run verify:archive"]

[tasks.test]
description = "Run a regression suite; use --list to see suite names"
run = "node tests/run-suite.mjs"

[tasks."tools:sync"]
description = "Refresh generated tool docs and prompt-console data from the catalogue"
run = "npm run sync:tools"

[tasks."package:portable"]
description = "Build the Windows portable package or an unpacked directory"
run = "npm run package:portable --"

[tasks."migrate:constraints"]
description = "Plan, apply or verify an explicit constraint-room copy migration"
run = "python -B tools/constraint-room-migration/migrate.py"

[tasks."knowledge:fetch"]
description = "Explicitly download the curated historical architecture books"
run = "python -B scripts/fetch-architecture-books.py"

[tasks."knowledge:index"]
description = "Build the local architecture book index without a model or network"
run = "python -B .agents/skills/minecraft-nbt-modeler/scripts/nbt_architecture_knowledge.py --library workspace/architecture-knowledge build"

[tasks."knowledge:benchmark"]
description = "Measure offline retrieval against the selected architecture book library"
run = "python -B tests/engine/architecture-retrieval-benchmark.py"

[tasks."patterns:check"]
description = "Check the bundled interior and micro-pattern data against the generators"
run = ["python -B scripts/assets/build-interior-patterns.py --check", "python -B scripts/assets/build-micro-patterns.py --check"]

[tasks."gpu:setup"]
description = "Install optional NVIDIA compute libraries in build/gpu-env using pip cache"
run = "python scripts/gpu-runtime.py setup"

[tasks."gpu:info"]
description = "Probe the optional compute backend"
run = "python scripts/gpu-runtime.py info"

[tasks."gpu:cli"]
description = "Run the shared CLI with the optional GPU Python runtime"
run = "python scripts/gpu-runtime.py node scripts/cli.mjs"

[tasks."gpu:test"]
description = "Run CPU and real GPU compute/transform regressions"
run = "python scripts/gpu-runtime.py python -B tests/engine/compute-transforms.py --require-gpu"

[tasks."gpu:benchmark"]
description = "Measure transfers, cold/warm compute and full tool calls"
run = "python scripts/gpu-runtime.py python -B scripts/benchmarks/benchmark-compute.py"

[tasks."cpu:test"]
description = "Verify bulk writes, catalogue invalidation and strict validation"
run = "node tests/run-suite.mjs materialization"

[tasks."model:test"]
description = "Verify whole-model composition, managed updates and assembly interfaces"
run = "node tests/run-suite.mjs model-workflow"

[tasks."fit:test"]
description = "Verify fine block silhouettes, state transforms and recipe roundtrips"
run = "node tests/run-suite.mjs fitting-shapes"

[tasks."gpu:materialization"]
description = "Benchmark CPU materialization with CPU and GPU field inputs"
run = "python scripts/gpu-runtime.py python -B scripts/benchmarks/benchmark-materialization.py"

[tasks."architecture:test"]
description = "Verify executable building plans, source protection and review bindings"
run = "node tests/run-suite.mjs architecture-workflow"

[tasks."architecture:preview"]
description = "Build three full buildings through CLI/frozen entry and render three-scale reviews"
run = "node tests/run-suite.mjs architecture-preview"

[tasks."roof:test"]
description = "Verify curved roof contact, protection and shared structure entry points"
run = "node tests/run-suite.mjs roof-curves"

[tasks."modular:test"]
description = "Verify object recipes, stair handrails, column sections and shared placement"
run = "node tests/run-suite.mjs modular"

[tasks."assets:sync"]
description = "Import a verified official asset library release into the application snapshot"
run = "python -B scripts/assets/sync-asset-library.py"

[tasks."assets:check"]
description = "Verify bundled external asset data and hashes"
run = "python -B scripts/assets/sync-asset-library.py --check"

[tasks."assets:test"]
description = "Verify local and remote libraries, integrity, offline use and rollback"
run = "node tests/run-suite.mjs asset-libraries"

[tasks."assets:desktop"]
description = "Build and verify external asset discovery, preview, import and offline desktop flow"
run = "node tests/run-suite.mjs unified-assets"

[tasks."ornate:test"]
description = "Verify the authored ornate collection; requires sibling NBTCreator-AssetLibrary"
run = "python -B tests/engine/ornate-library.py --library ../NBTCreator-AssetLibrary"

[tasks."ui:test"]
description = "Verify studio journeys, focus, delivery and six-page window/zoom layouts"
run = "node tests/run-suite.mjs studio-redesign"

[tasks."ci:build"]
description = "Build the production frontend for Windows validation"
alias = "build:web"
run = "npm run build:web"

[tasks."ci:quick"]
description = "Run model and source desktop smoke tests after ci:build"
run = ["node tests/run-suite.mjs model-workflow", "node tests/run-suite.mjs desktop"]

[tools]
python = "3.14.7"
