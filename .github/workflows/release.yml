name: Windows Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate-and-package:
    uses: ./.github/workflows/portable.yml
  release:
    needs: validate-and-package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-x64-portable-${{ github.sha }}
          path: assets
      - name: Publish versioned Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          sha256sum --check ./*.sha256
          args=(--verify-tag --title "NBTCreator $RELEASE_TAG")
          if [[ -f release-notes.md ]]; then args+=(--notes-file release-notes.md); else args+=(--generate-notes); fi
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" ./*.zip ./*.sha256 ./*.manifest.json ./*-constraint-room-migration.py "${args[@]}"
