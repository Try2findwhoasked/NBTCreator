name: Windows Portable
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/portable-browser
permissions:
  contents: read
concurrency:
  group: portable-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select validation scope
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          scope=full
          if [[ "$EVENT" == pull_request ]]; then
            git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/portable-changes"
            scope=docs
            while IFS= read -r -d '' path; do
              case "$path" in
                docs/archive/releases/*) scope=full; break ;;
                README.md|docs/*.md) ;;
                .agents/skills/minecraft-nbt-modeler/assets/viewer/src/*|.agents/skills/minecraft-nbt-modeler/scripts/*.py)
                  scope=quick ;;
                *) scope=full; break ;;
              esac
            done < "$RUNNER_TEMP/portable-changes"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Validation scope: $scope" >> "$GITHUB_STEP_SUMMARY"
  source-contracts:
    needs: changes
    if: needs.changes.outputs.scope != 'docs'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
      - name: Prepare pinned renderer for source regression
        run: mise run ci:renderer
      - name: Validate source and contracts
        run: mise run ci:source
      - name: Verify source desktop and model smoke
        if: needs.changes.outputs.scope == 'quick'
        run: mise run ci:quick
      - name: Verify native Electron launch
        run: mise run ci:electron
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: test-diagnostics-source-contracts
          path: |
            build/**/results.json
            build/**/electron.log
            build/**/*.png
          retention-days: 7
  asset-desktop:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
      - name: Prepare pinned renderer for source regression
        run: mise run ci:renderer
      - name: Verify native Electron launch
        run: mise run ci:electron
      - name: Verify unified asset library desktop flow
        run: mise run ci:asset-desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: test-diagnostics-asset-desktop
          path: |
            build/**/results.json
            build/**/electron.log
            build/**/*.png
          retention-days: 7
  model-pipelines:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        group: [components, collaboration, delivery]
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
      - name: Prepare pinned renderer for source regression
        run: mise run ci:renderer
      - name: Verify native Electron launch
        run: mise run ci:electron
      - name: Verify model pipeline
        run: mise run ci:model-${{ matrix.group }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: test-diagnostics-model-pipelines-${{ matrix.group }}
          path: |
            build/**/results.json
            build/**/electron.log
            build/**/*.png
          retention-days: 7
  authoring-contracts:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
      - name: Prepare pinned renderer for source regression
        run: mise run ci:renderer
      - name: Verify native Electron launch
        run: mise run ci:electron
      - name: Verify authoring contracts
        run: mise run ci:authoring
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: test-diagnostics-authoring-contracts
          path: |
            build/**/results.json
            build/**/electron.log
            build/**/*.png
          retention-days: 7
  portable-package:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check tag version
        env:
          BUILD_REF: ${{ github.ref }}
        run: |
          if ($env:BUILD_REF.StartsWith('refs/tags/')) {
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
            if ($env:BUILD_REF -ne "refs/tags/v$version") { throw 'Tag must match package.json version' }
          }
      - uses: ./.github/actions/setup-windows
      - name: Build and verify portable ZIP
        run: mise run ci:package
      - name: Stage release notes
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $notes = Join-Path $PWD "docs/archive/releases/RELEASE_$version.md"
          if (Test-Path -LiteralPath $notes) { Copy-Item -LiteralPath $notes -Destination dist/portable/release-notes.md }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-x64-portable-${{ github.sha }}
          path: |
            dist/portable/*.zip
            dist/portable/*.sha256
            dist/portable/*.manifest.json
            dist/portable/*-constraint-room-migration.py
            dist/portable/release-notes.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: test-diagnostics-portable-package
          path: |
            build/**/results.json
            build/**/electron.log
            build/**/*.png
          retention-days: 7
  # Keep the required check present even when a validation tier skips jobs.
  build:
    needs: [changes, source-contracts, asset-desktop, model-pipelines, authoring-contracts, portable-package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the jobs selected for this run
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['JOB_RESULTS'])
          scope = results['changes']['outputs'].get('scope')
          required_jobs = {
              'docs': ['changes'],
              'quick': ['changes', 'source-contracts'],
              'full': list(results),
          }
          if scope not in required_jobs:
              raise SystemExit(f'Invalid validation scope: {scope!r}')
          failed = {name: results[name]['result'] for name in required_jobs[scope]
                    if results[name]['result'] != 'success'}
          if failed:
              raise SystemExit(f'Required jobs did not succeed: {failed}')
          PY
