name: Windows Portable
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/portable-browser
permissions:
  contents: read
concurrency:
  group: portable-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select validation scope
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          scope=full
          if [[ "$EVENT" == pull_request ]]; then
            git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/portable-changes"
            scope=docs
            while IFS= read -r -d '' path; do
              case "$path" in
                docs/archive/releases/*) scope=full; break ;;
                README.md|docs/*.md) ;;
                .agents/skills/minecraft-nbt-modeler/assets/viewer/src/*|.agents/skills/minecraft-nbt-modeler/scripts/*.py)
                  scope=quick ;;
                *) scope=full; break ;;
              esac
            done < "$RUNNER_TEMP/portable-changes"
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "Validation scope: $scope" >> "$GITHUB_STEP_SUMMARY"
  source-contracts:
    needs: changes
    if: needs.changes.outputs.scope != 'docs'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
      - name: Prepare pinned renderer for source regression
        run: |
          mise exec -- node .agents/skills/minecraft-nbt-modeler/assets/viewer/node_modules/playwright/cli.js install chromium --no-shell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate source and contracts
        run: |
          mise exec -- npm run check:tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- npm run verify:archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- npm run test:api
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/portable-contracts.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- npm run test:workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node --test tests/node/prompt-creation.mjs tests/node/agent-handoff.test.mjs tests/node/internal-ai.test.cjs tests/node/component-move.mjs tests/node/updater.test.cjs tests/node/app-settings.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node scripts/cli.mjs check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise run assets:check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/asset-libraries.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/modular-objects.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/structural-members.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/window-frames.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify source desktop and model smoke
        if: needs.changes.outputs.scope == 'quick'
        run: mise run ci:quick
      - name: Verify native Electron launch
        env:
          ELECTRON_ENABLE_LOGGING: '1'
        run: mise exec -- node tests/desktop/electron-launch.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: test-diagnostics-source-contracts
          path: |
            build/**/results.json
            build/**/electron.log
            build/**/*.png
          retention-days: 7
  asset-desktop:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
      - name: Prepare pinned renderer for source regression
        run: |
          mise exec -- node .agents/skills/minecraft-nbt-modeler/assets/viewer/node_modules/playwright/cli.js install chromium --no-shell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native Electron launch
        env:
          ELECTRON_ENABLE_LOGGING: '1'
        run: mise exec -- node tests/desktop/electron-launch.mjs
      - name: Verify unified asset library desktop flow
        env:
          DEBUG: 'pw:browser'
        run: mise exec -- node tests/desktop/unified-assets-desktop.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: test-diagnostics-asset-desktop
          path: |
            build/**/results.json
            build/**/electron.log
            build/**/*.png
          retention-days: 7
  model-pipelines:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
      - name: Prepare pinned renderer for source regression
        run: |
          mise exec -- node .agents/skills/minecraft-nbt-modeler/assets/viewer/node_modules/playwright/cli.js install chromium --no-shell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native Electron launch
        env:
          ELECTRON_ENABLE_LOGGING: '1'
        run: mise exec -- node tests/desktop/electron-launch.mjs
      - name: Verify Agent evidence and whole-model pipelines
        env:
          DEBUG: 'pw:browser'
        run: |
          $probeRoot = Join-Path $PWD 'build/ci-model-pipelines'
          if (Test-Path -LiteralPath $probeRoot) { throw 'Keep prior regression evidence; expected a fresh CI directory' }
          New-Item -ItemType Directory -Path $probeRoot | Out-Null
          mise exec -- npm run test:projects
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/surface-mount.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/parametric-components.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/structure-agent.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/protection-mask.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/walk-inspection.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/prompt-archive.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/feedback-tasks.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/batches.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/selection-edit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/retrieval.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/architecture-knowledge.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/diagnostic-guidance.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/architect-tools.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/agent-protocol.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/agent-task-return.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node --test tests/node/retrieval.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node --test tests/node/selection-edit.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/auto-roads.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node --test tests/node/ai-component.test.mjs tests/node/edit-session-store.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/desktop/auto-roads-desktop.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/desktop/transform-sliders-desktop.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node --test tests/node/batch-links.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/desktop/feedback-tasks-desktop.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/desktop/batch-workspaces-desktop.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/desktop/selection-edit-desktop.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/desktop/retrieval-desktop.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/desktop/agent-task-return-desktop.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/desktop/prompt-archive-desktop.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/desktop/walk-desktop.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/reusable-recipes.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node --test tests/node/edit-session-store.test.mjs tests/node/app-settings.test.cjs tests/node/command-preferences.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node --test tests/node/backend-result.test.mjs tests/node/mesh-scheduling.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/desktop/mesh-scheduling-desktop.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/desktop/structure-agent-desktop.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/render-runtime.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/feedback-index.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/node/feedback-evidence.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/standalone-openings.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/standalone-pipeline.py --output (Join-Path $probeRoot 'standalone')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/candidate-validation.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node .agents/skills/minecraft-nbt-modeler/assets/viewer/test-candidate-validation.mjs --output (Join-Path $probeRoot 'candidate-browser')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node --test tests/node/workspace-api.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/node/task-cancel.mjs --output (Join-Path $probeRoot 'task-cancel')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python .agents/skills/minecraft-nbt-modeler/scripts/check_collision_fixtures.py --output (Join-Path $probeRoot 'collision.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python .agents/skills/minecraft-nbt-modeler/scripts/check_refine_fixtures.py --output (Join-Path $probeRoot 'refine')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python .agents/skills/minecraft-nbt-modeler/scripts/check_web_revision_fixtures.py --output (Join-Path $probeRoot 'web-revision')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: test-diagnostics-model-pipelines
          path: |
            build/**/results.json
            build/**/electron.log
            build/**/*.png
          retention-days: 7
  authoring-contracts:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-windows
      - name: Prepare pinned renderer for source regression
        run: |
          mise exec -- node .agents/skills/minecraft-nbt-modeler/assets/viewer/node_modules/playwright/cli.js install chromium --no-shell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify native Electron launch
        env:
          ELECTRON_ENABLE_LOGGING: '1'
        run: mise exec -- node tests/desktop/electron-launch.mjs
      - name: Verify authoring contracts
        env:
          DEBUG: 'pw:browser'
        run: |
          mise exec -- python -B tests/engine/roof-curves.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python -B tests/engine/architectural-bay.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- npm run test:architecture-workflow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- npm run test:architecture-preview
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- npm run test:model-workflow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- npm run test:extensions
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/snbt-source.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- python tests/engine/building-history.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/desktop/architect-tools-desktop.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/desktop/ai-batch-desktop.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/desktop/architect-workspace-desktop.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/desktop/feedback-autosave-desktop.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:NBTCREATOR_TEST_SNBT = '1'
          mise exec -- node tests/desktop/desktop-smoke.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:NBTCREATOR_TEST_SNBT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: test-diagnostics-authoring-contracts
          path: |
            build/**/results.json
            build/**/electron.log
            build/**/*.png
          retention-days: 7
  portable-package:
    needs: changes
    if: needs.changes.outputs.scope == 'full'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check tag version
        env:
          BUILD_REF: ${{ github.ref }}
        run: |
          if ($env:BUILD_REF.StartsWith('refs/tags/')) {
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
            if ($env:BUILD_REF -ne "refs/tags/v$version") { throw 'Tag must match package.json version' }
          }
      - uses: ./.github/actions/setup-windows
      - name: Build portable ZIP
        run: |
          mise exec -- npm run package:portable -- --out dist/portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $notes = Join-Path $PWD "docs/archive/releases/RELEASE_$version.md"
          if (Test-Path -LiteralPath $notes) { Copy-Item -LiteralPath $notes -Destination dist/portable/release-notes.md }
      - name: Verify extracted package with external Python and Git
        run: mise exec -- npm run test:portable -- --archive-dir dist/portable
      - name: Packaged Electron regression
        run: |
          $env:NBTCREATOR_TEST_EXE = Join-Path $PWD 'dist/portable/NBTCreator-win32-x64/NBTCreator.exe'
          Remove-Item Env:NBTCREATOR_PYTHON -ErrorAction SilentlyContinue
          mise exec -- npm run test:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/desktop/updater-desktop.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- npm run test:api-desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/desktop/protection-desktop.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/desktop/walk-desktop.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/desktop/prompt-archive-desktop.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/desktop/mesh-scheduling-desktop.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/desktop/workspace-api-desktop.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/desktop/feedback-tasks-desktop.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/desktop/batch-workspaces-desktop.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/desktop/selection-edit-desktop.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/desktop/retrieval-desktop.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mise exec -- node tests/desktop/agent-task-return-desktop.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-x64-portable-${{ github.sha }}
          path: |
            dist/portable/*.zip
            dist/portable/*.sha256
            dist/portable/*.manifest.json
            dist/portable/*-constraint-room-migration.py
            dist/portable/release-notes.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: test-diagnostics-portable-package
          path: |
            build/**/results.json
            build/**/electron.log
            build/**/*.png
          retention-days: 7
  # Keep the required check present even when a validation tier skips jobs.
  build:
    needs: [changes, source-contracts, asset-desktop, model-pipelines, authoring-contracts, portable-package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the jobs selected for this run
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['JOB_RESULTS'])
          scope = results['changes']['outputs'].get('scope')
          required_jobs = {
              'docs': ['changes'],
              'quick': ['changes', 'source-contracts'],
              'full': list(results),
          }
          if scope not in required_jobs:
              raise SystemExit(f'Invalid validation scope: {scope!r}')
          failed = {name: results[name]['result'] for name in required_jobs[scope]
                    if results[name]['result'] != 'success'}
          if failed:
              raise SystemExit(f'Required jobs did not succeed: {failed}')
          PY
  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-x64-portable-${{ github.sha }}
          path: assets
      - name: Publish versioned Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          sha256sum --check ./*.sha256
          args=(--verify-tag --title "NBTCreator $RELEASE_TAG")
          if [[ -f release-notes.md ]]; then args+=(--notes-file release-notes.md); else args+=(--generate-notes); fi
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" ./*.zip ./*.sha256 ./*.manifest.json ./*-constraint-room-migration.py "${args[@]}"
